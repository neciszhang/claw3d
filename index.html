<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1030" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕹️%3C/text%3E%3C/svg%3E"
    />
    <title>3D 娃娃机</title>
    <script>
      ;(function () {
        function setRem() {
          var w = Math.min(document.documentElement.clientWidth, 768)
          document.documentElement.style.fontSize = (w / 375) * 16 + 'px'
        }
        setRem()
        window.addEventListener('resize', setRem)
        window.addEventListener('orientationchange', setRem)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
